<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#f7f6f2"/>
  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a1a1a">Si5351 clock board</text>
  <text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#444">Replaces the stock clock. The firmware drives clock output 0 and reads the chip at I2C 0x60.</text>
  <rect x="80" y="110" width="280" height="230" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1a1a1a">Si5351 breakout</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1a1a">
    <text x="100" y="185">3V3</text>
    <text x="100" y="220">GND</text>
    <text x="100" y="255">SDA</text>
    <text x="100" y="290">SCL</text>
    <text x="100" y="325">CLK0</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="360" y1="180" x2="560" y2="180"/>
    <line x1="360" y1="215" x2="560" y2="215"/>
    <line x1="360" y1="250" x2="560" y2="250"/>
    <line x1="360" y1="285" x2="560" y2="285"/>
    <line x1="360" y1="320" x2="560" y2="320"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1a1a1a">
    <text x="575" y="185">3.3 V</text>
    <text x="575" y="220">Ground</text>
    <text x="575" y="255">I2C SDA, same bus as the TV5725</text>
    <text x="575" y="290">I2C SCL</text>
    <text x="575" y="325">TV5725 pin 40, external clock</text>
  </g>
  <text x="40" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#444">The stock crystal path is unused. Frame Time Lock tunes this clock. No other clock wiring is in this build.</text>
</svg>
